name: Integration Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "8-apply-mirror-weight-penalty-after-selection" ]
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run all tests with verbose output
        run: go test -v -race -timeout=10m ./...

      - name: Run tests with short timeout
        run: go test -v -short ./...

      - name: Run benchmark tests (collect baseline)
        run: go test -bench=. -benchmem -run=^$ ./... | tee benchmark.txt || true

      - name: Check for data races
        run: go test -race ./...

      - name: Test build variants
        run: |
          CGO_ENABLED=0 go build -o /tmp/trinity-cache-static ./cmd/trinity-cache
          file /tmp/trinity-cache-static
          GOOS=linux GOARCH=arm64 go build -o /tmp/trinity-cache-arm64 ./cmd/trinity-cache

      - name: Verify go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git diff go.mod go.sum)" ]; then
            echo "go.mod or go.sum is out of date"
            git diff go.mod go.sum
            exit 1
          fi

      - name: Store benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: benchmark.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
