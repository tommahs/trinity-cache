services:
  trinity-cache:
    build:
      context: .
      dockerfile: Dockerfile
    image: trinity-cache:dev
    container_name: trinity-cache
    restart: unless-stopped

    ports:
      - "8080:8080"

    command:
      - "--config"
      - "/var/lib/trinity-cache/trinity-cache.yaml"
    volumes:
      - ./data:/var/lib/trinity-cache
